# Include this inside the existing app server's `server {}` block.
# The Docker embedded resolver is queried at request time because proxy_pass uses
# a variable. Nginx can start even when lusk-api is not running or attached yet.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

# Keep /api outside the SPA's `try_files $uri /index.html` fallback.
location = /api {
    return 308 /api/;
}

location ^~ /api/ {
    set $lusk_api_upstream lusk-api:8000;
    proxy_pass http://$lusk_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
